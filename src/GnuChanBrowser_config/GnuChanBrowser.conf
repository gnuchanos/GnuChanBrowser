# path ~/.config/GnuChanBrowser/GnuChanBrowser.conf
#
# GnuchanOS web browser settings. Like other GnuChan program config files
# this is a CONFIG file, not an executable script, only read.

Version = "0.1.0"

# Default start page.
HomePage = "https://gnuchanos.org"

# Show tab titles?
ShowTabs = True

# Window size (width x height).
WindowWidth = 1024
WindowHeight = 768
